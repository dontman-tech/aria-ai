[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aria-ai"
version = "1.0.0"
description = "ARIA - Advanced Reasoning and Intelligent Assistant. A voice-enabled AI assistant inspired by FRIDAY from Iron Man."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "ARIA Project"}]
keywords = ["ai", "assistant", "voice", "friday", "iron-man", "jarvis", "stt", "tts", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pyyaml>=6.0",
    "SpeechRecognition>=3.10.0",
    "pyttsx3>=2.90",
    "openai>=1.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
voice = ["pyaudio>=0.2.13"]
whisper = ["openai-whisper>=20231117"]
gtts = ["gTTS>=2.5.0"]
anthropic = ["anthropic>=0.40.0"]
web = ["flask>=3.0.0"]
all = [
    "pyaudio>=0.2.13",
    "openai-whisper>=20231117",
    "gTTS>=2.5.0",
    "anthropic>=0.40.0",
    "flask>=3.0.0",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
aria = "aria.core.assistant:main"
aria-web = "aria.ui.web:run_web_cli"

[project.urls]
Homepage = "https://github.com/dontman-tech/aria-ai"

[tool.setuptools.packages.find]
include = ["aria*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
